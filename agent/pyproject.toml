description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manash", email = "manashlamichhane5@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "langchain>=1.3.1",
    "langchain-core>=1.6.1",
